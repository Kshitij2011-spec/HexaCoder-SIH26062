name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Unit & Schema Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify repository and canonical artifacts
        run: |
          test -f supabase/migrations/20260917000000_expedition_operational_schema.sql
          test -f supabase/seed.sql
          test -f AGENTS.md
          test -f .env.example

      - name: Run Backend Pytest Suite
        run: python -m pytest tests/ -v
